<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EARSHOT — a map of what places sound like</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0D;
    --panel:#16171A;
    --line:#26282C;
    --text:#EDEBE6;
    --text-dim:#86898F;
    --amber:#E2A03F;
    --teal:#3FBFAD;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
  #map{position:absolute;inset:0;background:var(--bg);}
  .leaflet-container{background:var(--bg);font-family:'Inter',sans-serif;}
  .leaflet-control-attribution{background:rgba(10,11,13,.7)!important;color:var(--text-dim)!important;font-size:10px;}
  .leaflet-control-attribution a{color:var(--text-dim)!important;}
  .leaflet-control-zoom{display:none;}
  .ny-mask{pointer-events:none;}

  /* top bar */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:500;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(180deg,rgba(10,11,13,.9) 0%,rgba(10,11,13,0) 100%);
    pointer-events:none;
  }
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:.5px;}
  .brand span{color:var(--amber);}
  .pin-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:2px;}

  /* locate button */
  .locate-btn{
    position:absolute;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:500;
    width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    transition:transform .15s ease,border-color .2s ease;
  }
  .locate-btn:active{transform:scale(.92);}
  .locate-btn.locating svg{animation:spin 1s linear infinite;}
  .locate-btn.located{border-color:var(--amber);color:var(--amber);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* drop-here button (pill) */
  .hint{
    position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:500;
    background:var(--panel);border:1px solid var(--line);border-radius:100px;
    padding:11px 20px;font-size:13px;color:var(--text-dim);font-family:'Inter',sans-serif;
    display:flex;align-items:center;gap:8px;cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    transition:opacity .3s ease,transform .15s ease;
  }
  .hint:active{transform:translateX(-50%) scale(.96);}
  .hint-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0;transition:background .2s ease;}
  .hint.hidden{opacity:0;pointer-events:none;}
  .hint.busy{pointer-events:none;opacity:.75;}
  .hint.busy .hint-dot{background:var(--teal);}

  /* recording sheet */
  .sheet-scrim{
    position:absolute;inset:0;z-index:900;background:rgba(0,0,0,0);
    transition:background .25s ease;pointer-events:none;
  }
  .sheet-scrim.open{background:rgba(0,0,0,.55);pointer-events:auto;}

  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:901;
    background:var(--panel);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:22px 22px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(105%);
    transition:transform .32s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-grip{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 18px;}

  .coords{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:20px;}

  .rec-stage{display:flex;flex-direction:column;align-items:center;gap:20px;}

  .waveform{
    width:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:3px;
  }
  .waveform .bar{
    width:3px;border-radius:2px;background:var(--line);height:6px;
    transition:height .08s ease,background .15s ease;
  }
  .waveform.live .bar{background:var(--amber);}

  .rec-btn{
    width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;
    background:var(--amber);position:relative;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease;
  }
  .rec-btn:active{transform:scale(.94);}
  .rec-btn::after{
    content:'';width:26px;height:26px;border-radius:50%;background:var(--bg);
  }
  .rec-btn.recording::after{border-radius:6px;width:22px;height:22px;background:#0A0B0D;}
  .rec-btn.recording{background:#D9564E;}
  .rec-ring{
    position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--amber);
    opacity:0;
  }
  .rec-ring.active{animation:ring 1.6s ease-out infinite;}
  @keyframes ring{
    0%{transform:scale(1);opacity:.6;}
    100%{transform:scale(1.5);opacity:0;}
  }

  .rec-label{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-dim);min-height:18px;}
  .rec-label.active{color:var(--amber);}

  .rec-hint-text{font-size:13px;color:var(--text-dim);text-align:center;max-width:260px;}

  .sheet-actions{display:flex;gap:10px;width:100%;margin-top:4px;}
  .btn{
    flex:1;padding:14px;border-radius:10px;border:1px solid var(--line);
    background:transparent;color:var(--text-dim);font-family:'Inter';font-weight:600;font-size:14px;
    cursor:pointer;transition:all .15s ease;
  }
  .btn.primary{background:var(--amber);color:#0A0B0D;border-color:var(--amber);}
  .btn:active{transform:scale(.97);}
  .btn.hidden{display:none;}
  .btn:disabled{opacity:.55;cursor:default;}

  audio.preview{width:100%;margin-top:2px;}

  .field-group{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:2px;}
  .field-group.hidden{display:none;}
  .field-input,.field-textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;
    outline:none;transition:border-color .15s ease;
  }
  .field-input::placeholder,.field-textarea::placeholder{color:var(--text-dim);}
  .field-input:focus,.field-textarea:focus{border-color:var(--amber);}
  .field-textarea{resize:none;min-height:60px;line-height:1.4;}

  /* map pin */
  .sound-pin{position:relative;width:26px;height:26px;}
  .sound-pin .core{
    position:absolute;top:8px;left:8px;width:10px;height:10px;border-radius:50%;
    background:var(--amber);box-shadow:0 0 0 3px rgba(226,160,63,.18);
  }
  .sound-pin .ripple{
    position:absolute;top:8px;left:8px;width:10px;height:10px;border-radius:50%;
    border:1.5px solid var(--amber);opacity:0;
  }
  .sound-pin .ripple.r1{animation:pinripple 2.6s ease-out infinite;}
  .sound-pin .ripple.r2{animation:pinripple 2.6s ease-out infinite 1.3s;}
  @keyframes pinripple{
    0%{transform:scale(1);opacity:.55;}
    100%{transform:scale(2.8);opacity:0;}
  }
  .sound-pin.playing .core{background:var(--teal);}
  .sound-pin.playing .ripple{border-color:var(--teal);animation-duration:.9s;}

  .leaflet-popup-content-wrapper{
    background:var(--panel);color:var(--text);border-radius:10px;border:1px solid var(--line);
  }
  .leaflet-popup-tip{background:var(--panel);border:1px solid var(--line);}
  .leaflet-popup-content{margin:12px 14px;font-family:'Inter';}
  .popup-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--text);margin-bottom:4px;}
  .popup-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .popup-desc{font-size:12px;color:var(--text-dim);line-height:1.4;margin-bottom:10px;}
  .popup-play{
    display:flex;align-items:center;gap:8px;background:var(--amber);color:#0A0B0D;
    border:none;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;width:100%;
    justify-content:center;transition:background .2s ease,transform .15s ease;
  }
  .popup-play:active{transform:scale(.97);}
  .popup-play.playing{background:var(--teal);}
  .popup-play .play-icon{font-size:11px;line-height:1;}
  .popup-play.playing .play-icon{display:none;}
  .popup-play .eq{display:none;align-items:flex-end;gap:3px;height:13px;}
  .popup-play.playing .eq{display:flex;}
  .popup-play .eq span{width:3px;border-radius:1px;background:#0A0B0D;display:block;height:4px;animation:eqbounce .9s ease-in-out infinite;}
  .popup-play .eq span:nth-child(2){animation-delay:.2s;}
  .popup-play .eq span:nth-child(3){animation-delay:.4s;}
  @keyframes eqbounce{
    0%,100%{height:4px;}
    50%{height:13px;}
  }
  .leaflet-popup-close-button{color:var(--text-dim)!important;}

  .toast{
    position:absolute;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-10px);
    z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 16px;font-size:13px;opacity:0;transition:all .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div>
    <div class="brand">EAR<span>SHOT</span></div>
    <div class="pin-count" id="pinCount">0 sounds pinned</div>
  </div>
</div>

<button class="hint" id="hint" type="button">
  <div class="hint-dot"></div>
  <span id="hintLabel">Tap to drop a sound (NY only)</span>
</button>

<button class="locate-btn" id="locateBtn" aria-label="Go to my location">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <line x1="12" y1="2" x2="12" y2="5"></line>
    <line x1="12" y1="19" x2="12" y2="22"></line>
    <line x1="2" y1="12" x2="5" y2="12"></line>
    <line x1="19" y1="12" x2="22" y2="12"></line>
  </svg>
</button>

<div class="toast" id="toast"></div>

<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div class="coords" id="coords">0.0000, 0.0000</div>

  <div class="rec-stage">
    <div class="waveform" id="waveform"></div>

    <div style="position:relative;">
      <div class="rec-ring" id="ring"></div>
      <button class="rec-btn" id="recBtn"></button>
    </div>

    <div class="rec-label" id="recLabel">Tap to record — up to 15s</div>

    <audio class="preview hidden" id="preview" controls></audio>

    <div class="field-group hidden" id="fieldGroup">
      <input type="text" class="field-input" id="titleInput" placeholder="Title (optional)" maxlength="80">
      <textarea class="field-textarea" id="descInput" placeholder="Short description (optional)" maxlength="240" rows="2"></textarea>
    </div>

    <div class="sheet-actions">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary hidden" id="saveBtn">Drop pin</button>
    </div>
  </div>
</div>

  function isInNewYork(lat, lng){
    for (var r=0; r<NY_BOUNDARY_RINGS.length; r++){
      var ring = NY_BOUNDARY_RINGS[r], inside = false;
      for (var i=0, j=ring.length-1; i<ring.length; j=i++){
        var xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
        if (((yi>lat) !== (yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside = !inside;
      }
      if (inside) return true;
    }
    return false;
  }

  // Hatch out everywhere that isn't New York: one giant world-covering
  // rectangle with the NY rings punched out as holes (even-odd fill),
  // painted with a diagonal-line SVG pattern instead of a flat color.
  (function drawOutOfStateMask(){
    var WORLD_RING = [[-90,-360],[-90,360],[90,360],[90,-360]];
    var maskRings = [WORLD_RING].concat(NY_BOUNDARY_RINGS.map(function(ring){
      return ring.map(function(pt){ return [pt[1], pt[0]]; }); // [lng,lat] -> [lat,lng]
    }));

    var renderer = L.svg().addTo(map);
    var svg = renderer._container;
    var ns = 'http://www.w3.org/2000/svg';
    var defs = document.createElementNS(ns, 'defs');
    var pattern = document.createElementNS(ns, 'pattern');
    pattern.setAttribute('id', 'nyOutOfStateHatch');
    pattern.setAttribute('patternUnits', 'userSpaceOnUse');
    pattern.setAttribute('width', '8');
    pattern.setAttribute('height', '8');
    pattern.setAttribute('patternTransform', 'rotate(45)');
    var bg = document.createElementNS(ns, 'rect');
    bg.setAttribute('width', '8');
    bg.setAttribute('height', '8');
    bg.setAttribute('fill', '#0A0B0D');
    bg.setAttribute('fill-opacity', '0.62');
    var line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', '0'); line.setAttribute('y1', '0');
    line.setAttribute('x2', '0'); line.setAttribute('y2', '8');
    line.setAttribute('stroke', '#26282C');
    line.setAttribute('stroke-width', '2');
    pattern.appendChild(bg);
    pattern.appendChild(line);
    defs.appendChild(pattern);
    svg.insertBefore(defs, svg.firstChild);

    L.polygon(maskRings, {
      renderer: renderer,
      stroke: false,
      fill: true,
      fillColor: 'url(#nyOutOfStateHatch)',
      fillOpacity: 1,
      fillRule: 'evenodd',
      interactive: false,
      className: 'ny-mask'
    }).addTo(map);
  })();

  // ---------- geolocation ----------
  function getCurrentLatLng(onSuccess, onError){
    if (!navigator.geolocation){
      showToast('Location isn\'t available on this browser');
      if (onError) onError();
      return;
    }
    navigator.geolocation.getCurrentPosition(function(pos){
      onSuccess({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    }, function(err){
      if (err.code === 1) showToast('Location permission denied');
      else showToast('Couldn\'t get your location');
      if (onError) onError();
    }, { enableHighAccuracy: true, timeout: 8000 });
  }

  function showMeMarker(latlng){
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.circleMarker([latlng.lat, latlng.lng], {
      radius: 7,
      color: '#3FBFAD',
      weight: 2,
      fillColor: '#3FBFAD',
      fillOpacity: 0.5
    }).addTo(map);
  }

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos){
      map.setView([pos.coords.latitude, pos.coords.longitude], 14);
    }, function(){ /* silent fallback to default view */ }, { timeout: 4000 });
  }

  var locateBtn = document.getElementById('locateBtn');
  locateBtn.addEventListener('click', function(){
    locateBtn.classList.add('locating');
    getCurrentLatLng(function(latlng){
      locateBtn.classList.remove('locating');
      locateBtn.classList.add('located');
      map.setView([latlng.lat, latlng.lng], 16);
      showMeMarker(latlng);
      setTimeout(function(){ locateBtn.classList.remove('located'); }, 2000);
    }, function(){
      locateBtn.classList.remove('locating');
    });
  });

  // ---------- DOM refs ----------
  var hint = document.getElementById('hint');
  var hintLabel = document.getElementById('hintLabel');
  var scrim = document.getElementById('scrim');
  var sheet = document.getElementById('sheet');
  var coordsEl = document.getElementById('coords');
  var recBtn = document.getElementById('recBtn');
  var ring = document.getElementById('ring');
  var recLabel = document.getElementById('recLabel');
  var preview = document.getElementById('preview');
  var fieldGroup = document.getElementById('fieldGroup');
  var titleInput = document.getElementById('titleInput');
  var descInput = document.getElementById('descInput');
  var saveBtn = document.getElementById('saveBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var waveform = document.getElementById('waveform');
  var pinCountEl = document.getElementById('pinCount');
  var toast = document.getElementById('toast');

  // build waveform bars
  var BAR_COUNT = 28;
  for (var i=0;i<BAR_COUNT;i++){
    var b = document.createElement('div');
    b.className = 'bar';
    waveform.appendChild(b);
  }
  var bars = waveform.querySelectorAll('.bar');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  }

  // ---------- sheet open/close ----------
  function openSheet(latlng){
    pendingLatLng = latlng;
    coordsEl.textContent = latlng.lat.toFixed(4) + ', ' + latlng.lng.toFixed(4);
    resetRecordUI();
    scrim.classList.add('open');
    sheet.classList.add('open');
    hint.classList.add('hidden');
  }

  function closeSheet(){
    scrim.classList.remove('open');
    sheet.classList.remove('open');
    stopRecordingIfActive();
    resetRecordUI();
    hint.classList.remove('hidden');
  }

  scrim.addEventListener('click', closeSheet);

  hint.addEventListener('click', function(){
    if (sheet.classList.contains('open') || hint.classList.contains('busy')) return;
    hint.classList.add('busy');
    var originalLabel = hintLabel.textContent;
    hintLabel.textContent = 'Finding you…';
    getCurrentLatLng(function(latlng){
      hint.classList.remove('busy');
      hintLabel.textContent = originalLabel;
      if (!isInNewYork(latlng.lat, latlng.lng)){
        showToast('EARSHOT pins are New York State only');
        return;
      }
      map.setView([latlng.lat, latlng.lng], 16);
      showMeMarker(latlng);
      openSheet(latlng);
    }, function(){
      hint.classList.remove('busy');
      hintLabel.textContent = originalLabel;
    });
  });

  cancelBtn.addEventListener('click', closeSheet);

  function resetRecordUI(){
    recBtn.classList.remove('recording');
    ring.classList.remove('active');
    recLabel.textContent = 'Tap to record — up to ' + MAX_SECONDS + 's';
    recLabel.classList.remove('active');
    preview.classList.add('hidden');
    preview.src = '';
    fieldGroup.classList.add('hidden');
    titleInput.value = '';
    descInput.value = '';
    saveBtn.classList.add('hidden');
    cancelBtn.textContent = 'Cancel';
    waveform.classList.remove('live');
    bars.forEach(function(b){ b.style.height='6px'; });
    recordSeconds = 0;
    if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
    recBtn.style.display = 'flex';
  }

  // ---------- recording ----------
  recBtn.addEventListener('click', function(){
    if (recBtn.classList.contains('recording')) {
      stopRecordingIfActive();
    } else {
      startRecording();
    }
  });

  function startRecording(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showToast('This browser can\'t access the microphone');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      recordedChunks = [];
      var mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType:mimeType }) : new MediaRecorder(stream);

      mediaRecorder.ondataavailable = function(e){
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        finishRecording();
      };
      mediaRecorder.start();

      recBtn.classList.add('recording');
      ring.classList.add('active');
      recLabel.classList.add('active');
      waveform.classList.add('live');
      recordSeconds = 0;
      recLabel.textContent = '0:00';

      setupVisualizer(stream);

      recordTimer = setInterval(function(){
        recordSeconds++;
        var m = Math.floor(recordSeconds/60), s = recordSeconds%60;
        recLabel.textContent = m + ':' + (s<10?'0':'') + s;
        if (recordSeconds >= MAX_SECONDS) stopRecordingIfActive();
      }, 1000);

    }).catch(function(err){
      showToast('Microphone permission denied');
    });
  }

  function stopRecordingIfActive(){
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
    if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    if (audioCtx) { audioCtx.close().catch(function(){}); audioCtx = null; }
    ring.classList.remove('active');
    waveform.classList.remove('live');
  }

  function finishRecording(){
    recBtn.classList.remove('recording');
    recBtn.style.display = 'none';
    recLabel.classList.remove('active');
    recLabel.textContent = 'Recorded ' + recLabelTime();

    var blob = new Blob(recordedChunks, { type: recordedChunks[0] ? recordedChunks[0].type : 'audio/webm' });
    currentBlobUrl = URL.createObjectURL(blob);
    preview.src = currentBlobUrl;
    preview.classList.remove('hidden');
    fieldGroup.classList.remove('hidden');
    saveBtn.classList.remove('hidden');
    cancelBtn.textContent = 'Discard';

    saveBtn.onclick = function(){ commitPin(blob, recordSeconds); };
  }

  function recLabelTime(){
    var m = Math.floor(recordSeconds/60), s = recordSeconds%60;
    return m + ':' + (s<10?'0':'') + s;
  }

  function setupVisualizer(stream){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceNode = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      sourceNode.connect(analyser);
      var data = new Uint8Array(analyser.frequencyBinCount);

      function draw(){
        analyser.getByteFrequencyData(data);
        for (var i=0;i<bars.length;i++){
          var v = data[i % data.length] / 255;
          bars[i].style.height = Math.max(6, v*48) + 'px';
        }
        animFrame = requestAnimationFrame(draw);
      }
      draw();
    } catch(e){ /* visualizer is cosmetic, fail silently */ }
  }

  // ---------- committing a pin ----------
  function extFromMime(type){
    if (!type) return 'webm';
    if (type.indexOf('webm') > -1) return 'webm';
    if (type.indexOf('mp4') > -1) return 'm4a';
    if (type.indexOf('ogg') > -1) return 'ogg';
    return 'webm';
  }

  function rowToPin(row){
    return {
      id: row.id,
      lat: row.lat,
      lng: row.lng,
      audioPath: row.audio_path,
      url: sb.storage.from(SOUNDS_BUCKET).getPublicUrl(row.audio_path).data.publicUrl,
      duration: row.duration,
      title: row.title || '',
      description: row.description || '',
      time: new Date(row.created_at)
    };
  }

  function commitPin(blob, duration){
    var latlng = pendingLatLng;
    var title = titleInput.value.trim();
    var description = descInput.value.trim();
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    var path = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'p' + Date.now() + Math.random().toString(16).slice(2)) + '.' + extFromMime(blob.type);

    sb.storage.from(SOUNDS_BUCKET).upload(path, blob, { contentType: blob.type || 'audio/webm' })
      .then(function(res){
        if (res.error) throw res.error;
        return sb.from('pins').insert({
          lat: latlng.lat,
          lng: latlng.lng,
          audio_path: path,
          duration: duration,
          title: title || null,
          description: description || null
        }).select().single();
      })
      .then(function(res){
        if (res.error) throw res.error;
        var pin = rowToPin(res.data);
        pins.push(pin);
        addPinToMap(pin);
        updatePinCount();
        closeSheet();
        showToast('Sound dropped');
      })
      .catch(function(err){
        console.error(err);
        showToast('Couldn\'t save — try again');
      })
      .finally(function(){
        saveBtn.disabled = false;
        saveBtn.textContent = 'Drop pin';
      });
  }

  function updatePinCount(){
    pinCountEl.textContent = pins.length + (pins.length === 1 ? ' sound pinned' : ' sounds pinned');
  }

  // ---------- loading existing pins ----------
  function loadPins(){
    sb.from('pins').select('*').order('created_at', { ascending: true })
      .then(function(res){
        if (res.error) throw res.error;
        res.data.forEach(function(row){
          var pin = rowToPin(row);
          pins.push(pin);
          addPinToMap(pin);
        });
        updatePinCount();
      })
      .catch(function(err){
        console.error(err);
        showToast('Couldn\'t load saved sounds');
      });
  }
  loadPins();

  // ---------- map pins ----------
  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addPinToMap(pin){
    var icon = L.divIcon({
      className: '',
      html: '<div class="sound-pin" id="mark-'+pin.id+'"><div class="ripple r1"></div><div class="ripple r2"></div><div class="core"></div></div>',
      iconSize: [26,26],
      iconAnchor: [13,13]
    });
    var marker = L.marker([pin.lat, pin.lng], { icon: icon }).addTo(map);
    var popupHtml =
      (pin.title ? '<div class="popup-title">' + escapeHtml(pin.title) + '</div>' : '') +
      '<div class="popup-time">' + formatTime(pin.time) + ' &middot; ' + pin.duration + 's</div>' +
      (pin.description ? '<div class="popup-desc">' + escapeHtml(pin.description) + '</div>' : '') +
      '<button class="popup-play" id="play-'+pin.id+'">' +
        '<span class="play-icon">&#9654;</span>' +
        '<span class="eq"><span></span><span></span><span></span></span>' +
        '<span class="play-label">Play</span>' +
      '</button>';
    marker.bindPopup(popupHtml);

    marker.on('popupopen', function(){
      var btn = document.getElementById('play-'+pin.id);
      if (!btn) return;
      if (activePin === pin.id) { setBtnPlaying(btn, true); activePlayBtn = btn; }
      btn.onclick = function(){ playPin(pin, btn); };
    });
  }

  function formatTime(d){
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return h + ':' + (m<10?'0':'') + m + ' ' + ampm;
  }

  function setBtnPlaying(btn, isPlaying){
    if (!btn) return;
    btn.classList.toggle('playing', isPlaying);
    var label = btn.querySelector('.play-label');
    if (label) label.textContent = isPlaying ? 'Playing' : 'Play';
  }

  function playPin(pin, btn){
    var wasSamePin = activePin === pin.id;

    if (activePopupAudio){
      activePopupAudio.pause();
      setBtnPlaying(activePlayBtn, false);
      var prevMark = document.getElementById('mark-'+activePin);
      if (prevMark) prevMark.classList.remove('playing');
      activePopupAudio = null;
      activePin = null;
      activePlayBtn = null;
    }
    if (wasSamePin) return; // tapping the playing pin's button again just stops it

    var a = new Audio(pin.url);
    activePopupAudio = a;
    activePin = pin.id;
    activePlayBtn = btn;
    var el = document.getElementById('mark-'+pin.id);
    if (el) el.classList.add('playing');
    setBtnPlaying(btn, true);
    a.play();
    a.onended = function(){
      if (el) el.classList.remove('playing');
      setBtnPlaying(btn, false);
      activePin = null;
      activePopupAudio = null;
      activePlayBtn = null;
    };
  }

})();
</script>
